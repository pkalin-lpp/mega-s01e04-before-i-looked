# Preview for review (plan.md § 3, § 4; ADR 0003). Runs rig, saves /digest/2026-10-28 with a
# command and deploys that one file to GitHub Pages. The page never enters git: it goes up as a
# short-lived Pages artifact. Run again with marker=false to upload the clean copy over the same link.
name: preview

on:
  workflow_dispatch:
    inputs:
      marker:
        description: "Carry the lane marker (secret LANE_MARKER). false = the clean-up copy."
        type: boolean
        default: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  preview:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: pnpm install --no-frozen-lockfile
      - name: Save /digest/2026-10-28
        env:
          LANE_MARKER: ${{ inputs.marker && secrets.LANE_MARKER || '' }}
        run: |
          pnpm start &
          for i in $(seq 1 30); do curl -sf http://localhost:8787/health > /dev/null && break; sleep 1; done
          mkdir -p _site
          curl -sf http://localhost:8787/digest/2026-10-28 -o _site/index.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          retention-days: 1
      - id: deploy
        uses: actions/deploy-pages@v5
